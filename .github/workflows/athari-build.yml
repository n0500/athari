name: Athari • Build Check

on:
  workflow_run:
    workflows:
      - "Athari • Apply Update"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athari-build
  cancel-in-progress: true

jobs:
  build:
    name: Validate static web app

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest applied version
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static app
        run: npm run build

      - name: Verify Firebase Hosting output
        run: test -f out/index.html
