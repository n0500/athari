name: Athari • Apply Update

on:
  push:
    branches:
      - main
    paths:
      - "Athari-updates.zip"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: athari-updates
  cancel-in-progress: true

jobs:
  apply-update:
    name: Apply Athari update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check update package
        run: |
          test -f "Athari-updates.zip" || {
            echo "Athari-updates.zip was not found."
            exit 1
          }

      - name: Validate update package
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath

          archive = "Athari-updates.zip"

          with ZipFile(archive) as z:
              files = [
                  n.replace("\\", "/")
                  for n in z.namelist()
                  if not n.endswith("/")
              ]

          if not files:
              raise SystemExit("Update package is empty.")

          for name in files:
              path = PurePosixPath(name)
              lower = name.lower()

              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe path: {name}")

              if name.startswith((".git/", ".github/", "node_modules/")):
                  raise SystemExit(f"Protected path: {name}")

              if path.name.startswith(".env") and path.name != ".env.example":
                  raise SystemExit(f"Environment secrets are blocked: {name}")

              if "serviceaccount" in lower or "firebase-adminsdk" in lower:
                  raise SystemExit(f"Sensitive credential file blocked: {name}")

          print(f"Validated {len(files)} update files.")
          PY

      - name: Extract update
        run: |
          rm -rf .athari-update
          mkdir -p .athari-update
          unzip -q Athari-updates.zip -d .athari-update

      - name: Apply update
        run: |
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="node_modules/" \
            --exclude=".env" \
            .athari-update/ ./

          rm -rf .athari-update

      - name: Save applied update
        run: |
          git add -A ':(exclude)Athari-updates.zip'

          if git diff --cached --quiet; then
            echo "No project files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: apply Athari update"
          git push
