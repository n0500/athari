name: Athari • Update & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "updates/Athari-updates.zip"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: athari-production
  cancel-in-progress: true

jobs:
  update-and-deploy:
    name: Apply update and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check update package
        run: |
          test -f "updates/Athari-updates.zip" || {
            echo "Athari-updates.zip was not found."
            exit 1
          }

      - name: Validate update package
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath

          archive = "updates/Athari-updates.zip"

          with ZipFile(archive) as z:
              files = [
                  n.replace("\\", "/")
                  for n in z.namelist()
                  if not n.endswith("/")
              ]

          if not files:
              raise SystemExit("Update package is empty.")

          for name in files:
              path = PurePosixPath(name)
              lower = name.lower()

              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe path: {name}")

              if name.startswith((".git/", ".github/", "node_modules/")):
                  raise SystemExit(f"Protected path: {name}")

              if path.name.startswith(".env") and path.name != ".env.example":
                  raise SystemExit(f"Environment secrets are blocked: {name}")

              if "serviceaccount" in lower or "firebase-adminsdk" in lower:
                  raise SystemExit(f"Sensitive credential file blocked: {name}")

          print(f"Validated {len(files)} update files.")
          PY

      - name: Extract update
        run: |
          rm -rf .athari-update
          mkdir -p .athari-update
          unzip -q updates/Athari-updates.zip -d .athari-update

      - name: Apply update
        run: |
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="updates/" \
            --exclude="node_modules/" \
            --exclude=".env" \
            .athari-update/ ./

          rm -rf .athari-update

      - name: Detect application
        id: app
        run: |
          if [[ -f package.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.app.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Run checks
        if: steps.app.outputs.ready == 'true'
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Build Athari
        if: steps.app.outputs.ready == 'true'
        run: npm run build --if-present

      - name: Save applied update to repository
        run: |
          git add -A ':(exclude)updates/Athari-updates.zip'

          if git diff --cached --quiet; then
            echo "No project files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: apply Athari update"
          git push

      - name: Check Firebase configuration
        id: firebase
        run: |
          if [[ -f firebase.json ]] \
             && [[ -n "${{ vars.FIREBASE_PROJECT_ID }}" ]] \
             && [[ -n "${{ vars.WIF_PROVIDER }}" ]] \
             && [[ -n "${{ vars.WIF_SERVICE_ACCOUNT }}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firebase deployment is not configured yet. Skipping deployment."
          fi

      - name: Authenticate to Google Cloud
        if: steps.firebase.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.firebase.outputs.ready == 'true'
        run: npm install --global firebase-tools

      - name: Deploy Athari
        if: steps.firebase.outputs.ready == 'true'
        run: |
          firebase deploy \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --only hosting,functions
